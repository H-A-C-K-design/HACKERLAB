<body>
<canvas id="bg-canvas"></canvas>
<div id="app"></div>

<!-- Firebase Client SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCiaL8G7VIiVeTb1K_5JS5byU8u-i2aHgs",
    authDomain: "hackerlab-2ae3a.firebaseapp.com",
    projectId: "hackerlab-2ae3a",
    storageBucket: "hackerlab-2ae3a.firebasestorage.app",
    messagingSenderId: "671203746234",
    appId: "1:671203746234:web:385dbe1c6a86c8d2f9fd83"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  // Expose globally for app.js
  window.firebaseAuth = auth;
  window.googleProvider = googleProvider;
  window.signInWithPopup = signInWithPopup;
  window.signInWithRedirect = signInWithRedirect;
  window.getRedirectResult = getRedirectResult;
  window.firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));

  // Handle redirect result on page load (after Google redirects back)
  getRedirectResult(auth).then(result => {
    if (!result) return;
    const googleUser = result.user;
    googleUser.getIdToken().then(idToken => {
      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
      const targetUrl = isLocalHost ? (window.location.port === '5000' ? '/api/auth/google' : 'http://localhost:5000/api/auth/google') : '/api/auth/google';
      fetch(targetUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          idToken,
          email: googleUser.email,
          username: googleUser.displayName?.replace(/\s+/g, '_').toLowerCase() || 'user_' + Date.now(),
          photoURL: googleUser.photoURL
        })
      }).then(r => r.json()).then(data => {
        if (data.success) {
          localStorage.setItem('cf_token', data.token);
          localStorage.setItem('cf_user', JSON.stringify(data.user));
          window.location.href = '/';
        }
      });
    });
  }).catch(() => {});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
<script src="app.js?v=20260811_restored"></script>
<script>
/* ─── Animated grid / particle canvas ─── */
const C = document.getElementById('bg-canvas');
const X = C.getContext('2d');
C.style.cssText = 'position:fixed;top:0;left:0;z-index:0;pointer-events:none';

function resize() { C.width = innerWidth; C.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

const dots = Array.from({length:80}, () => ({
  x: Math.random()*innerWidth, y: Math.random()*innerHeight,
  vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
  r: Math.random()*1.5+.5
}));

function drawFrame() {
  X.clearRect(0,0,C.width,C.height);
  dots.forEach(d => {
    d.x += d.vx; d.y += d.vy;
    if(d.x<0) d.x=C.width; if(d.x>C.width) d.x=0;
    if(d.y<0) d.y=C.height; if(d.y>C.height) d.y=0;
    X.beginPath(); X.arc(d.x,d.y,d.r,0,Math.PI*2);
    X.fillStyle='rgba(124,58,237,.1)'; X.fill();
  });
  dots.forEach((a,i) => dots.slice(i+1).forEach(b => {
    const dx=a.x-b.x, dy=a.y-b.y, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<120) {
      X.beginPath(); X.moveTo(a.x,a.y); X.lineTo(b.x,b.y);
      X.strokeStyle=`rgba(124,58,237,${.06*(1-dist/120)})`;
      X.lineWidth=.6; X.stroke();
    }
  }));
  requestAnimationFrame(drawFrame);
}
drawFrame();
</script>
</body>
</html>
