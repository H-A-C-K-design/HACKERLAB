<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CyberForge Academy | Live CTF Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link rel="stylesheet" href="styles.css"/>
<!-- reCAPTCHA v2 Checkbox API -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script>
  window.RECAPTCHA_SITE_KEY = '6LdhXn8tAAAAAImyZ7ElHS_TYkkBfKcvYS_jDt_u';

  window.onRecaptchaSuccess = function(token) {
    const statusEl = document.getElementById('recaptcha-gateway-status');
    if (statusEl) {
      statusEl.innerHTML = '<span style="color:#059669"><i class="fas fa-circle-check"></i> Verification successful! Opening CyberForge...</span>';
    }
    sessionStorage.setItem('cf_recaptcha_verified', 'true');
    setTimeout(() => {
      const overlay = document.getElementById('recaptcha-gateway-overlay');
      if (overlay) overlay.classList.add('hidden');
    }, 600);
  };

  window.onRecaptchaExpired = function() {
    const statusEl = document.getElementById('recaptcha-gateway-status');
    if (statusEl) {
      statusEl.innerHTML = '<span style="color:#dc2626"><i class="fas fa-circle-exclamation"></i> Verification expired. Please check again.</span>';
    }
    sessionStorage.removeItem('cf_recaptcha_verified');
  };

  // Automatically hide overlay if already verified in this session
  if (sessionStorage.getItem('cf_recaptcha_verified') === 'true') {
    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.getElementById('recaptcha-gateway-overlay');
      if (overlay) overlay.classList.add('hidden');
    });
  }
</script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="app"></div>

<!-- reCAPTCHA v2 Security Gateway Overlay -->
<div id="recaptcha-gateway-overlay" class="recaptcha-gateway-overlay">
  <div class="recaptcha-gateway-box">
    <div class="recaptcha-gateway-icon">
      <i class="fas fa-shield-halved"></i>
    </div>
    <div class="recaptcha-gateway-title">SECURITY CHECK</div>
    <div class="recaptcha-gateway-sub">
      Please check the <b>"I'm not a robot"</b> box below to open CyberForge Academy.
    </div>
    <div class="recaptcha-widget-wrap">
      <div class="g-recaptcha" data-sitekey="6LdhXn8tAAAAAImyZ7ElHS_TYkkBfKcvYS_jDt_u" data-callback="onRecaptchaSuccess" data-expired-callback="onRecaptchaExpired"></div>
    </div>
    <div id="recaptcha-gateway-status"></div>
    <script>
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        document.write('<div style="margin-top:0.8rem"><button onclick="onRecaptchaSuccess(\'dev-token\')" style="background:#f3f4f6;color:#4b5563;border:1px solid #d1d5db;font-size:0.75rem;padding:0.35rem 0.9rem;border-radius:6px;cursor:pointer">⚡ Local Dev Bypass</button></div>');
      }
    </script>
  </div>
</div>

<!-- Firebase Client SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyCiaL8G7VIiVeTb1K_5JS5byU8u-i2aHgs",
    authDomain: "hackerlab-2ae3a.firebaseapp.com",
    projectId: "hackerlab-2ae3a",
    storageBucket: "hackerlab-2ae3a.firebasestorage.app",
    messagingSenderId: "671203746234",
    appId: "1:671203746234:web:e27c7d5a8fa3f387f9fd83"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();

  // Expose globally for app.js
  window.firebaseAuth = auth;
  window.googleProvider = googleProvider;
  window.signInWithPopup = signInWithPopup;
  window.signInWithRedirect = signInWithRedirect;
  window.getRedirectResult = getRedirectResult;
  window.firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));

  // Handle redirect result on page load (after Google redirects back)
  getRedirectResult(auth).then(result => {
    if (!result) return;
    const googleUser = result.user;
    googleUser.getIdToken().then(idToken => {
      const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const targetUrl = isLocalHost ? (window.location.port === '5000' ? '/api/auth/google' : 'http://localhost:5000/api/auth/google') : '/api/auth/google';
      fetch(targetUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          idToken,
          email: googleUser.email,
          username: googleUser.displayName?.replace(/\s+/g, '_').toLowerCase() || 'user_' + Date.now(),
          photoURL: googleUser.photoURL
        })
      }).then(r => r.json()).then(data => {
        if (data.success) {
          localStorage.setItem('cf_token', data.token);
          localStorage.setItem('cf_user', JSON.stringify(data.user));
          window.location.href = '/';
        }
      });
    });
  }).catch(() => {});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
<script src="app.js"></script>
<script>
/* ─── Animated grid / particle canvas ─── */
const C = document.getElementById('bg-canvas');
const X = C.getContext('2d');
C.style.cssText = 'position:fixed;top:0;left:0;z-index:0;pointer-events:none';

function resize() { C.width = innerWidth; C.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

const dots = Array.from({length:80}, () => ({
  x: Math.random()*innerWidth, y: Math.random()*innerHeight,
  vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3,
  r: Math.random()*1.5+.5
}));

function drawFrame() {
  X.clearRect(0,0,C.width,C.height);
  dots.forEach(d => {
    d.x += d.vx; d.y += d.vy;
    if(d.x<0) d.x=C.width; if(d.x>C.width) d.x=0;
    if(d.y<0) d.y=C.height; if(d.y>C.height) d.y=0;
    X.beginPath(); X.arc(d.x,d.y,d.r,0,Math.PI*2);
    X.fillStyle='rgba(124,58,237,.1)'; X.fill();
  });
  dots.forEach((a,i) => dots.slice(i+1).forEach(b => {
    const dx=a.x-b.x, dy=a.y-b.y, dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<120) {
      X.beginPath(); X.moveTo(a.x,a.y); X.lineTo(b.x,b.y);
      X.strokeStyle=`rgba(124,58,237,${.06*(1-dist/120)})`;
      X.lineWidth=.6; X.stroke();
    }
  }));
  requestAnimationFrame(drawFrame);
}
drawFrame();
</script>
</body>
</html>
