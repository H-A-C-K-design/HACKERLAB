services:
  postgres:
    image: postgres:15-alpine
    container_name: cyberforge_postgres
    restart: always
    environment:
      POSTGRES_USER: cyberforge
      POSTGRES_PASSWORD: cyberforge_password
      POSTGRES_DB: cyberforge_academy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyberforge -d cyberforge_academy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
